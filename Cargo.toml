[package]
name = "voai"
version.workspace = true
edition.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXError", "AXUIElement", "AXValue", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFNumber", "CFRunLoop"] }
raw-window-handle = "0.6"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
tray-icon = { version = "0.26.1", default-features = false }
global-hotkey = "0.10"
async-channel = "2"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
security-framework = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
chrono = "0.4"
rusqlite = "0.37"
hound = "3.5"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioPlayer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSNotification", "NSOperation", "block2"] }
fs2 = "0.4"
# Keep HTTP wire traces from exposing private request bodies in application logs.
log = { version = "0.4", features = ["max_level_info"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVMediaFormat", "AVCaptureDevice", "block2"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "block2", "NSWorkspace", "NSRunningApplication", "NSAppearance", "NSApplication", "NSSavePanel", "NSScreen", "NSPanel", "NSWindow", "NSWindowRestoration", "NSView", "NSResponder", "libc"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDirectDisplay", "CGError", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "libc"] }
voai-models = { path = "crates/voai-models" }
voai-speech = { path = "crates/voai-speech" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
voai-speech = { path = "crates/voai-speech", features = ["test-fixtures"] }

[dependencies]
voai-l10n = { path = "crates/voai-l10n" }

[build-dependencies]
cc = "1"

[workspace]
resolver = "3"
members = ["crates/voai-asr-worker", "crates/voai-asr-helper", "crates/voai-l10n", "crates/voai-diarize", "crates/voai-models", "crates/voai-speech", "crates/voai-text-helper"]
default-members = ["."]

[workspace.package]
version = "1.8.1"
edition = "2024"

[profile.dev]
debug = 1

[profile.release]
strip = "debuginfo"
