[package]
name = "voai-speech"
version.workspace = true
edition.workspace = true
publish = false

[features]
test-fixtures = []

[dependencies]
voai-l10n = { path = "../voai-l10n" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
cpal = "0.17.3"
rtrb = "0.3"
rubato = "0.16"
whisper-rs = { version = "0.16", features = ["metal"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
