"prompt.default":
  en: "Correct capitalization and punctuation. Remove filler words and accidental repetitions. Keep the original language, meaning, and form of address. Use conventional spelling for recognizable technical terms and acronyms. In a technical context, write “эй ай” as “AI”. Keep “ай” when it expresses pain. Return only the edited text."
  ru: "Исправь регистр и пунктуацию, убери слова-паразиты и случайные повторы. Сохрани язык, смысл и обращение на «ты» или «вы». Узнаваемые технические термины и аббревиатуры пиши в общепринятой форме. В контексте технологий «эй ай», «эй-ай» и «эйай» пиши как AI. Например: «мы используем эй ай» → «Мы используем AI.» Междометие «ай» сохраняй: «ай больно» → «Ай, больно!» Верни только исправленную фразу."
