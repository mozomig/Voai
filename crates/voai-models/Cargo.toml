[package]
name = "voai-models"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
ring = "0.17"
hex = "0.4"
url = "2.5"
ureq = { version = "3.5", features = ["json"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
